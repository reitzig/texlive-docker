name: "Test & Publish"
on:
  schedule:
    - cron: '0 16 28 * *'
    # Verify that (most) things work before running the monthly release.
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
  pull_request:
  create:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG_LIST: "texlive-image-tags"
  TEXLIVE_INSTALLER_IMAGE: "texlive-installer:latest"
  DOCKERHUB_USER_NAME: "reitzig"
  # 2026-06-22 Seeing GPG signature validation errors when not setting a fixed mirror.
  # So, for now:
  CTAN_MIRROR: "http://ftp.fau.de/ctan"

jobs:
  lint-docker:
    name: "Lint: Dockerfile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

  test-create-minimal:
    name: "Test: Create Minimal Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Obtain Installer
        run: .github/scripts/build-installer-image.sh
        # TODO: Can the separate jobs share this image?
        # TODO: build daily? and push to GitHub registry? (--> catch APK upgrades)
      - name: "Build Test Image"
        run: .github/scripts/build-image.sh ${GITHUB_REF} minimal
      - name: "Test: Print version"
        run: docker run --rm $(head -n 1 "${IMAGE_TAG_LIST}") version

  build-test-image:
    name: "Build Test Image"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.echo.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Obtain Installer
        run: .github/scripts/build-installer-image.sh
      - name: "Build Test Image"
        run: .github/scripts/build-image.sh ${GITHUB_REF} base-luatex
        # TODO: better version than "merge" on PRs
      # TODO: push to GHCR (and write _that_ tag to the output)
      # TODO: aggressive cleanup policy
      - id: echo
        run: |
          echo "tag=$(head -n 1 "${IMAGE_TAG_LIST}")" >> "$GITHUB_OUTPUT"

  scan-image:
    name: "Scan Test Image"
    needs:
      - build-test-image
    runs-on: ubuntu-latest
#    permissions:
#      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy and output SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivy-config: 'trivy.yaml'
          hide-progress: true
          image-ref: "${{ needs.build-test-image.outputs.tag }}"
          format: 'sarif'
          output: 'trivy-results.sarif'
          github-pat: "${{ secrets.GITHUB_TOKEN }}"

      - name: Print scan result
        run: |
          jq < trivy-sarif.json \
            '.runs.[].tool.driver.rules | map({ id: .id, description: .shortDescription.text, severity: .properties."security-severity" }) | sort_by(.severity) | reverse' \
            > trivy-summary.json
          jq trivy-summary.json

          echo -e "# Trivy Scan Summary\n\n| ID | Severity | Description |\n| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          jq -r < trivy-summary.json \
            '. | map("| " + .id + " | " + .severity + " | " + .description + " |") | .[]'
            >> $GITHUB_STEP_SUMMARY

      # TODO: Does this overwrite Advisories or comment on the PR? (we want the latter)
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: 'always()'
        with:
          sarif_file: 'trivy-results.sarif'

  test-run-examples:
    name: "Test: Run Usage Examples"
    needs:
      - build-test-image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-case:
          - name: "Test: One-off build"
            id: one-off-build
          - name: "Test: Repeated build"
            id: repeated-build
          - name: "Test: Complex build"
            id: complex-build
          - name: "Test: Interactive build"
            id: interactive-build
          - name: "Test: Custom Image"
            id: custom-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ${{ matrix.test-case.name }}
        run: .github/scripts/run-example.sh "${{ needs.build-test-image.outputs.tag }}" ${{ matrix.test-case.id }}

  publish-release:
    name: Publish Images
    runs-on: ubuntu-latest
    needs:
      - test-create-minimal
      - test-run-examples
    if: startsWith(github.ref, 'refs/tags/pre-') || startsWith(github.ref, 'refs/tags/release-')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Obtain Installer
        run: .github/scripts/build-installer-image.sh
      - name: Build images
        run: |
          for p in profiles/*; do
            p=$(basename ${p})
            .github/scripts/build-image.sh ${GITHUB_REF} ${p%.profile}
          done
      - name: Publish images
        # TODO: Use step output instead of a file?
        #       --> https://help.github.com/en/github/automating-your-workflow-with-github-actions/development-tools-for-github-actions#set-an-output-parameter-set-output
        run: |
          docker login --username ${DOCKERHUB_USER_NAME} --password ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          while IFS= read -r tag; do
             docker push "${tag}"
          done <"${IMAGE_TAG_LIST}"
          docker logout
      # TODO: trigger scan-latest / scan latest
      - name: Determine version
        id: release-version
        run: |
          tag="${{ github.ref }}"
          version="${tag##*/*-}"
          is_prerelease=false
          title="Release ${version}"
          if [[ "${tag}" == *"/pre-"* ]]; then
            is_prerelease=true
            title="Pre-${title}"
          fi

          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${is_prerelease}" >> $GITHUB_OUTPUT
          echo "title=${title}" >> $GITHUB_OUTPUT
      - name: Assemble release notes
        id: release-notes
        # TODO: include actual changes
        # TODO: include security note, if anything got fixed
        run: |
          .github/scripts/assemble-release-notes.sh \
            "${IMAGE_TAG_LIST}" \
            > release-notes.md
      - name: Create Github release
        id: create-gh-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: ${{ steps.release-version.outputs.title }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ steps.release-version.outputs.is_prerelease }}
