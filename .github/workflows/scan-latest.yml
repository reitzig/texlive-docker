name: "Scan Latest"
on:
  schedule:
    - cron: '0 1 * * *' # every night; if a fix needs to be released, we want to know
  push:
    branches:
      - 'master'
    paths:
      - 'Dockerfile'
      - 'profiles/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-latest:
    name: "Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy and output SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36
        with:
          trivy-config: 'trivy.yaml'
          hide-progress: true
          image-ref: 'reitzig/texlive-base-luatex:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          github-pat: "${{ secrets.GITHUB_TOKEN }}"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4
        if: 'always()'
        with:
          sarif_file: 'trivy-results.sarif'


